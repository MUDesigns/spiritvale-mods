name: Deploy catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-catalog
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mudesigns/spiritvale-mods

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://www.spiritvalemods.com
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in
            NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.yml
          target: /tmp

      - name: Pull image and recreate web
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          PGADMIN_DEFAULT_EMAIL: ${{ vars.PGADMIN_DEFAULT_EMAIL }}
          PGADMIN_DEFAULT_PASSWORD: ${{ secrets.PGADMIN_DEFAULT_PASSWORD }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_BOT_SECRET: ${{ secrets.DISCORD_BOT_SECRET }}
          BOT_IMAGE: ghcr.io/mudesigns/spiritvale-mods-discord-bot:latest
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE,NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY,CLERK_SECRET_KEY,PGADMIN_DEFAULT_EMAIL,PGADMIN_DEFAULT_PASSWORD,DISCORD_TOKEN,DISCORD_BOT_SECRET,BOT_IMAGE
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
            sudo docker pull "$IMAGE"
            sudo docker pull "$BOT_IMAGE" || true
            sudo cp /tmp/docker-compose.yml /opt/spiritvale-mods/docker-compose.yml
            sudo python3 - "$IMAGE" "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" "$CLERK_SECRET_KEY" "$PGADMIN_DEFAULT_EMAIL" "$PGADMIN_DEFAULT_PASSWORD" "$DISCORD_TOKEN" "$DISCORD_BOT_SECRET" "$BOT_IMAGE" <<'PY'
            from pathlib import Path
            import sys
            path = Path("/opt/spiritvale-mods/.env")
            updates = {"WEB_IMAGE": sys.argv[1]}
            pk = sys.argv[2].strip() if len(sys.argv) > 2 else ""
            sk = sys.argv[3].strip() if len(sys.argv) > 3 else ""
            pg_email = sys.argv[4].strip() if len(sys.argv) > 4 else ""
            pg_password = sys.argv[5].strip() if len(sys.argv) > 5 else ""
            discord_token = sys.argv[6].strip() if len(sys.argv) > 6 else ""
            discord_secret = sys.argv[7].strip() if len(sys.argv) > 7 else ""
            bot_image = sys.argv[8].strip() if len(sys.argv) > 8 else ""
            if pk:
                updates["NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"] = pk
            if sk:
                updates["CLERK_SECRET_KEY"] = sk
            if pg_email:
                updates["PGADMIN_DEFAULT_EMAIL"] = pg_email
            if pg_password:
                updates["PGADMIN_DEFAULT_PASSWORD"] = pg_password
            if discord_token:
                updates["DISCORD_TOKEN"] = discord_token
            if discord_secret:
                updates["DISCORD_BOT_SECRET"] = discord_secret
            if bot_image:
                updates["BOT_IMAGE"] = bot_image
            updates["DISCORD_BOT_URL"] = "http://bot:8080"
            updates["DISCORD_INVITE_URL"] = "https://discord.gg/WmKSvZmhwT"
            lines = path.read_text().splitlines() if path.exists() else []
            out = []
            seen = set()
            for line in lines:
                key = line.split("=", 1)[0] if "=" in line else ""
                if key in updates:
                    out.append(f"{key}={updates[key]}")
                    seen.add(key)
                else:
                    out.append(line)
            for key, value in updates.items():
                if key not in seen:
                    out.append(f"{key}={value}")
            path.write_text("\n".join(out) + "\n")
            PY
            sudo chmod 600 /opt/spiritvale-mods/.env
            if ! sudo grep -q '^CLERK_SECRET_KEY=sk_live_' /opt/spiritvale-mods/.env; then
              echo "CLERK_SECRET_KEY was not written as a live key"
              exit 1
            fi
            if ! sudo grep -q '^PGADMIN_DEFAULT_PASSWORD=.' /opt/spiritvale-mods/.env; then
              echo "PGADMIN_DEFAULT_PASSWORD is missing from the host .env"
              exit 1
            fi
            cd /opt/spiritvale-mods
            sudo docker compose --env-file .env pull pgadmin || true
            sudo docker compose --env-file .env up -d --no-build pgadmin
            sudo docker compose --env-file .env up -d --no-build bot || true
            sudo docker compose --env-file .env up -d --no-build --force-recreate web
            sudo docker logout ghcr.io >/dev/null
            code=000
            for i in $(seq 1 45); do
              code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:3001/ || true)
              if [ "$code" = "200" ]; then
                echo "home $code after $i checks"
                break
              fi
              sleep 2
            done
            if [ "$code" != "200" ]; then
              echo "home failed with HTTP $code"
              sudo docker compose --env-file .env logs --tail=80 web
              exit 1
            fi
            curl -fsS -o /dev/null -w "catalog %{http_code}\n" --max-time 30 http://127.0.0.1:3001/api/catalog
