name: Deploy catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-catalog
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mudesigns/spiritvale-mods

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://www.spiritvalemods.com
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in
            NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.yml
          target: /tmp

      - name: Pull image and recreate web
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
            sudo docker pull "$IMAGE"
            sudo cp /tmp/docker-compose.yml /opt/spiritvale-mods/docker-compose.yml
            sudo python3 - "$IMAGE" <<'PY'
            from pathlib import Path
            import sys
            path = Path("/opt/spiritvale-mods/.env")
            image = sys.argv[1]
            lines = path.read_text().splitlines()
            out = []
            found = False
            for line in lines:
                if line.startswith("WEB_IMAGE="):
                    out.append(f"WEB_IMAGE={image}")
                    found = True
                else:
                    out.append(line)
            if not found:
                out.append(f"WEB_IMAGE={image}")
            path.write_text("\n".join(out) + "\n")
            PY
            sudo chmod 600 /opt/spiritvale-mods/.env
            cd /opt/spiritvale-mods
            sudo docker compose --env-file .env up -d --no-build --force-recreate web
            sudo docker logout ghcr.io >/dev/null
            code=000
            for i in $(seq 1 45); do
              code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:3001/ || true)
              if [ "$code" = "200" ]; then
                echo "home $code after $i checks"
                break
              fi
              sleep 2
            done
            if [ "$code" != "200" ]; then
              echo "home failed with HTTP $code"
              sudo docker compose --env-file .env logs --tail=80 web
              exit 1
            fi
            curl -fsS -o /dev/null -w "catalog %{http_code}\n" --max-time 30 http://127.0.0.1:3001/api/catalog
